# Read by the official Deploy to DigitalOcean flow.
# This template deploys the static frontend only; add Functions separately.
spec:
  name: ai-app-cost-explorer
  static_sites:
    - name: web
      git:
        branch: main
        repo_clone_url: https://github.com/2810sagar-beep/ai-app-cost-explorer.git
      source_dir: /
      environment_slug: node-js
      build_command: npm ci && npm run build
      output_dir: dist
      index_document: index.html
      routes:
        - path: /
