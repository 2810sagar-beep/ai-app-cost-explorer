# Inspect DigitalOcean's cost proposal before creating this app.
# Contains static + functions components only; no paid VM, container, DB, or bucket.
name: ai-app-cost-explorer
region: nyc
static_sites:
  - name: web
    github:
      repo: 2810sagar-beep/ai-app-cost-explorer
      branch: main
      deploy_on_push: false
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    routes:
      - path: /
functions:
  - name: api
    github:
      repo: 2810sagar-beep/ai-app-cost-explorer
      branch: main
      deploy_on_push: false
    source_dir: /functions
    routes:
      - path: /api
    envs:
      - key: LIVE_AI_ENABLED
        value: "false"
        scope: RUN_AND_BUILD_TIME
        type: GENERAL
      - key: DO_MODEL_ACCESS_KEY
        value: ""
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DO_API_TOKEN
        value: ""
        scope: RUN_AND_BUILD_TIME
        type: SECRET
      - key: DEMO_ACCESS_CODE
        value: ""
        scope: RUN_AND_BUILD_TIME
        type: SECRET
