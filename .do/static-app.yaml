# Optional initial deployment: functional calculator, no live AI backend.
name: ai-app-cost-explorer
region: nyc
static_sites:
  - name: web
    github:
      repo: 2810sagar-beep/ai-app-cost-explorer
      branch: main
      deploy_on_push: false
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    routes:
      - path: /
